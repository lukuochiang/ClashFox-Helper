name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare Go Cache Dirs
        run: mkdir -p "$HOME/go/pkg/mod" "$HOME/Library/Caches/go-build"

      - name: Show Versions
        run: |
          sw_vers
          go version

      - name: Unit Test
        run: go test ./cmd/privileged-helper

      - name: Compatibility Smoke
        run: bash scripts/compat-smoke.sh

      - name: Build Release Package
        run: bash scripts/release-package.sh

      - name: Verify Release Assets
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION.txt)"
          for arch in x86_64 arm64 universal; do
            test -f "release/clashfox-helper-v${version}-darwin-${arch}.tar.gz"
          done
          test -f VERSION.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VERSION.txt
            release/*.tar.gz
          generate_release_notes: true
